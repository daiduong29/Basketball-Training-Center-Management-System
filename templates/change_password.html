{% extends "base.html" %}

{% block title %}Change Password - ZONE SPORT CENTER{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="zone-card mb-4 border-2">
      <div class="zone-card-header">
        <h4 class="mb-0 text-white fw-bold"><i class="fas fa-shield-alt text-gold me-2"></i> CHANGE ACCOUNT PASSWORD</h4>
      </div>
      <div class="zone-card-body">
        <form method="POST" action="{{ url_for('change_password') }}">
          <div class="mb-3">
            <label class="form-label text-white" for="old_password">Current Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control form-control-lg bg-dark text-white border-secondary" id="old_password" name="old_password" placeholder="Enter current password" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-white" for="new_password">New Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control form-control-lg bg-dark text-white border-secondary" id="new_password" name="new_password" placeholder="Minimum 6 characters" required minlength="6">
          </div>

          <div class="mb-4">
            <label class="form-label text-white" for="confirm_password">Confirm New Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control form-control-lg bg-dark text-white border-secondary" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('user_profile') }}" class="btn btn-zone-secondary">
              <i class="fas fa-arrow-left me-1"></i> Back to Profile
            </a>
            <button type="submit" class="btn btn-zone-primary py-2 px-4">
              <i class="fas fa-check-circle me-1"></i> Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
