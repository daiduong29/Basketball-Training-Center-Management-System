{% extends "base.html" %}

{% block title %}Record Payment - ZONE SPORT CENTER{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="zone-card border-2">
      <div class="zone-card-header">
        <h4 class="mb-0 text-white fw-bold">
          <i class="fas fa-hand-holding-usd text-gold me-2"></i> RECORD STUDENT TUITION PAYMENT
        </h4>
      </div>
      <div class="zone-card-body">
        <form method="POST" action="{{ url_for('payment_record') }}">
          <!-- Select Student -->
          <div class="mb-3">
            <label class="form-label text-white" for="student_id">Select Student <span class="text-danger">*</span></label>
            <select class="form-select form-select-lg bg-dark text-white border-secondary" id="student_id" name="student_id" required>
              <option value="">-- Choose Student --</option>
              {% for s in students %}
              <option value="{{ s.id }}" {% if selected_student_id == s.id %}selected{% endif %}>
                {{ s.id }} - {{ s.name }} ({{ s.phone }})
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Select Class -->
          <div class="mb-3">
            <label class="form-label text-white" for="class_id">Select Class <span class="text-danger">*</span></label>
            <select class="form-select form-select-lg bg-dark text-white border-secondary" id="class_id" name="class_id" required onchange="onClassSelected()">
              <option value="">-- Choose Class --</option>
              {% for cl in classes %}
              <option value="{{ cl.id }}" data-fee="{{ cl.tuition_fee }}">
                {{ cl.name }} (Fee: ${{ "{:,.0f}".format(cl.tuition_fee) if cl.tuition_fee < 10000 else "{:,.0f} đ".format(cl.tuition_fee) }})
              </option>
              {% endfor %}
            </select>
          </div>

          <!-- Standard Fee & Paid Amount -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-white" for="amount">Standard Tuition Fee <span class="text-danger">*</span></label>
              <input type="number" class="form-control form-control-lg bg-dark text-white border-secondary" id="amount" name="amount" placeholder="1500000" required min="0" step="10000">
            </div>
            <div class="col-md-6">
              <label class="form-label text-white" for="paid_amount">Amount Paid Today <span class="text-danger">*</span></label>
              <input type="number" class="form-control form-control-lg bg-dark text-white border-secondary" id="paid_amount" name="paid_amount" placeholder="1500000" required min="0" step="10000" oninput="autoCheckStatus()">
            </div>
          </div>

          <!-- Status & Payment Method -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-white" for="status">Payment Status</label>
              <select class="form-select form-select-lg bg-dark text-white border-secondary" id="status" name="status">
                <option value="Đã thanh toán">Paid (Completed)</option>
                <option value="Chưa thanh toán">Unpaid (Outstanding Balance)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-white" for="payment_method">Payment Method</label>
              <select class="form-select form-select-lg bg-dark text-white border-secondary" id="payment_method" name="payment_method">
                <option value="Chuyển khoản QR">QR Code Transfer (Online / Banking)</option>
                <option value="Tiền mặt">Cash (Front Desk)</option>
                <option value="Thẻ tín dụng">Credit / Debit Card (POS)</option>
              </select>
            </div>
          </div>

          <!-- Payment Date & Note -->
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label text-white" for="payment_date">Payment Date</label>
              <input type="date" class="form-control form-control-lg bg-dark text-white border-secondary" id="payment_date" name="payment_date" value="{{ today_str }}">
            </div>
            <div class="col-md-6">
              <label class="form-label text-white" for="note">Transaction Note</label>
              <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary" id="note" name="note" placeholder="e.g. Bank transfer ref / Front desk receipt">
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center border-top border-secondary pt-3">
            <a href="{{ url_for('payment_list') }}" class="btn btn-zone-secondary">
              <i class="fas fa-arrow-left me-1"></i> Back to Payments
            </a>
            <button type="submit" class="btn btn-zone-primary py-2 px-4">
              <i class="fas fa-check-circle me-1"></i> Save Invoice
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function onClassSelected() {
    const sel = document.getElementById('class_id');
    const opt = sel.options[sel.selectedIndex];
    if (opt && opt.value) {
      const fee = opt.getAttribute('data-fee');
      document.getElementById('amount').value = fee;
      document.getElementById('paid_amount').value = fee;
      document.getElementById('status').value = 'Đã thanh toán';
    }
  }

  function autoCheckStatus() {
    const fee = parseInt(document.getElementById('amount').value || 0);
    const paid = parseInt(document.getElementById('paid_amount').value || 0);
    if (paid >= fee && fee > 0) {
      document.getElementById('status').value = 'Đã thanh toán';
    } else {
      document.getElementById('status').value = 'Chưa thanh toán';
    }
  }
</script>
{% endblock %}
