{% extends "base.html" %}

{% block title %}User Profile - ZONE SPORT CENTER{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="zone-card mb-4 border-2">
      <div class="zone-card-header">
        <h4 class="mb-0 text-white fw-bold"><i class="fas fa-user-edit text-gold me-2"></i> UPDATE USER PROFILE</h4>
        <span class="role-badge {% if current_user.role == 'admin' %}admin{% else %}coach{% endif %}">
          {{ current_user.role|upper }}
        </span>
      </div>
      <div class="zone-card-body">
        <form method="POST" action="{{ url_for('user_profile') }}">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label text-white">Username</label>
              <input type="text" class="form-control text-warning fw-bold bg-dark border-secondary" value="{{ current_user.username }}" readonly disabled>
              <div class="text-white small mt-1">Permanent system username</div>
            </div>
            <div class="col-md-6">
              <label class="form-label text-white">System Role</label>
              <input type="text" class="form-control text-gold fw-bold bg-dark border-secondary" value="{% if current_user.role == 'admin' %}Administrator (Admin){% else %}Coach ({{ current_user.coach_id }}){% endif %}" readonly disabled>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-white" for="full_name">Full Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label text-white" for="email">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control form-control-lg bg-dark text-white border-secondary" id="email" name="email" value="{{ current_user.email }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label text-white" for="phone">Phone Number <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-lg bg-dark text-white border-secondary" id="phone" name="phone" value="{{ current_user.phone }}" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-white" for="bio">Bio & Personal Philosophy</label>
            <textarea class="form-control bg-dark text-white border-secondary" id="bio" name="bio" rows="4" placeholder="Experience, strengths, coaching philosophies...">{{ current_user.bio or '' }}</textarea>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('change_password') }}" class="btn btn-zone-outline">
              <i class="fas fa-key me-1"></i> Change Password
            </a>
            <button type="submit" class="btn btn-zone-primary py-2 px-4">
              <i class="fas fa-save me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
